# Render Blueprint — API + Postgres only (UI is on Vercel)
# https://dashboard.render.com/blueprints/new → connect ak-sh1/shelfwise

databases:
  - name: shelfwise-db
    plan: free

services:
  - type: web
    name: shelfwise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shelfwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: /app
