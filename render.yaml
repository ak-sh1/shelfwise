# Render Blueprint — full stack (Postgres + API + Next.js UI)
# https://dashboard.render.com/blueprints/new → connect ak-sh1/shelfwise

databases:
  - name: shelfwise-db
    plan: free

services:
  - type: web
    name: shelfwise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shelfwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: /app

  - type: web
    name: shelfwise-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SHELFWISE_API_ORIGIN
        fromService:
          type: web
          name: shelfwise-api
          property: hostport
