# Render Blueprint — full stack (Postgres + API + Next.js UI)
# https://dashboard.render.com/blueprints/new → connect ak-sh1/shelfwise

databases:
  - name: shelfwise-db
    plan: free

services:
  - type: web
    name: shelfwise-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: shelfwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: .

  - type: web
    name: shelfwise-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Free web services cannot receive private-network traffic.
      # Use the public HTTPS URL (not hostport).
      - key: SHELFWISE_API_ORIGIN
        value: https://shelfwise-backend.onrender.com
