# Render Blueprint — one web app + Postgres (all on Render free tier)
# https://dashboard.render.com/blueprints/new → connect ak-sh1/shelfwise
#
# Creates:
#   shelfwise-db  — PostgreSQL
#   shelfwise     — Next.js UI + FastAPI in one Docker service

databases:
  - name: shelfwise-db
    plan: free

services:
  - type: web
    name: shelfwise
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shelfwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SHELFWISE_API_ORIGIN
        value: http://127.0.0.1:8331
      - key: PYTHONPATH
        value: /app/backend
